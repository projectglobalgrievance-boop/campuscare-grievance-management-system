name: grievance_app
description: AI-Based Student Grievance Management System for Smart Campus.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  geolocator: ^13.0.1
  camera: ^0.11.0
  connectivity_plus: ^6.0.5
  provider: ^6.1.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  fl_chart: ^0.69.0
  shared_preferences: ^2.3.2
  share_plus: ^10.0.2
  http: ^1.2.2
  intl: ^0.19.0
  path_provider: ^2.1.4
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/chatbot/
